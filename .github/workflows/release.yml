name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Verify release candidate
        run: make verify-release
      - name: Materialize signing key
        env:
          STARTER_WEBSOCKET_RELEASE_SIGNING_KEY: ${{ secrets.STARTER_WEBSOCKET_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$STARTER_WEBSOCKET_RELEASE_SIGNING_KEY"
          umask 077
          printf '%s' "$STARTER_WEBSOCKET_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/starter-websocket-release.key"
      - name: Build signed exact-commit artifacts
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          go run ./cmd/starter-websocket-release \
            -version="$GITHUB_REF_NAME" \
            -source-date-epoch="$epoch" \
            -signing-key="$RUNNER_TEMP/starter-websocket-release.key" \
            -output=dist
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/starter-websocket-release.key"
      - name: Publish immutable-tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --fail-on-no-commits
